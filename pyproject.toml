[project]
name = "pr-review-agent"
version = "0.1.0"
description = "Review GitHub pull requests from a GitHub App webhook and post the findings as a comment."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyJWT>=2.8",
    "cryptography>=42",
]

[project.scripts]
pr-review-listen = "pr_review.server:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pr_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]
